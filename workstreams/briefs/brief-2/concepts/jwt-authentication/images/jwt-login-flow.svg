<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">JWT login flow</title>
  <desc id="description">A step-by-step flow from a login request through validation, password comparison, account status, JWT signing, and a safe response.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071b33"/>
      <stop offset="1" stop-color="#0d2d4f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020b14" flood-opacity="0.55"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0 L12 6 L0 12 Z" fill="#41d9c0"/>
    </marker>
    <style>
      .title { font: 700 48px 'Segoe UI', Arial, sans-serif; fill: #f5fbff; }
      .subtitle { font: 400 22px 'Segoe UI', Arial, sans-serif; fill: #aac9e8; }
      .step { font: 700 25px 'Segoe UI', Arial, sans-serif; fill: #f5fbff; }
      .detail { font: 400 19px 'Segoe UI', Arial, sans-serif; fill: #c8ddf2; }
      .badge { font: 700 18px 'Segoe UI', Arial, sans-serif; fill: #071b33; }
      .arrow { stroke: #41d9c0; stroke-width: 6; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#background)"/>
  <circle cx="1450" cy="100" r="240" fill="#0b4670" opacity="0.24"/>
  <circle cx="130" cy="820" r="270" fill="#0d6b64" opacity="0.18"/>

  <text x="800" y="78" text-anchor="middle" class="title">JWT Login Flow</text>
  <text x="800" y="116" text-anchor="middle" class="subtitle">Validate → verify → authorize account → sign the smallest useful token</text>

  <g filter="url(#shadow)">
    <rect x="70" y="190" width="300" height="150" rx="24" fill="#123b62" stroke="#48b8ff" stroke-width="3"/>
    <circle cx="115" cy="232" r="23" fill="#48b8ff"/>
    <text x="115" y="239" text-anchor="middle" class="badge">1</text>
    <text x="155" y="238" class="step">Login request</text>
    <text x="105" y="282" class="detail">POST /api/auth/login</text>
    <text x="105" y="314" class="detail">email + password</text>

    <rect x="460" y="190" width="300" height="150" rx="24" fill="#123b62" stroke="#48b8ff" stroke-width="3"/>
    <circle cx="505" cy="232" r="23" fill="#48b8ff"/>
    <text x="505" y="239" text-anchor="middle" class="badge">2</text>
    <text x="545" y="238" class="step">Zod validation</text>
    <text x="495" y="282" class="detail">normalize email</text>
    <text x="495" y="314" class="detail">reject invalid input → 400</text>

    <rect x="850" y="190" width="300" height="150" rx="24" fill="#123b62" stroke="#48b8ff" stroke-width="3"/>
    <circle cx="895" cy="232" r="23" fill="#48b8ff"/>
    <text x="895" y="239" text-anchor="middle" class="badge">3</text>
    <text x="935" y="238" class="step">Find the user</text>
    <text x="885" y="282" class="detail">select hidden password hash</text>
    <text x="885" y="314" class="detail">unknown email → generic 401</text>

    <rect x="1240" y="190" width="300" height="150" rx="24" fill="#123b62" stroke="#48b8ff" stroke-width="3"/>
    <circle cx="1285" cy="232" r="23" fill="#48b8ff"/>
    <text x="1285" y="239" text-anchor="middle" class="badge">4</text>
    <text x="1325" y="238" class="step">Compare hashes</text>
    <text x="1275" y="282" class="detail">bcrypt.compare()</text>
    <text x="1275" y="314" class="detail">wrong password → generic 401</text>
  </g>

  <path d="M370 265 H445" class="arrow"/>
  <path d="M760 265 H835" class="arrow"/>
  <path d="M1150 265 H1225" class="arrow"/>
  <path d="M1390 340 V425 H250 V500" class="arrow"/>

  <g filter="url(#shadow)">
    <rect x="100" y="510" width="390" height="175" rx="24" fill="#123b62" stroke="#f3b64c" stroke-width="3"/>
    <circle cx="150" cy="555" r="23" fill="#f3b64c"/>
    <text x="150" y="562" text-anchor="middle" class="badge">5</text>
    <text x="190" y="562" class="step">Check account status</text>
    <text x="135" y="610" class="detail">active → continue</text>
    <text x="135" y="645" class="detail">suspended → 403</text>

    <rect x="605" y="510" width="390" height="175" rx="24" fill="#123b62" stroke="#41d9c0" stroke-width="3"/>
    <circle cx="655" cy="555" r="23" fill="#41d9c0"/>
    <text x="655" y="562" text-anchor="middle" class="badge">6</text>
    <text x="695" y="562" class="step">Sign the JWT</text>
    <text x="640" y="610" class="detail">subject: user ID</text>
    <text x="640" y="645" class="detail">role + expiration</text>

    <rect x="1110" y="510" width="390" height="175" rx="24" fill="#123b62" stroke="#41d9c0" stroke-width="3"/>
    <circle cx="1160" cy="555" r="23" fill="#41d9c0"/>
    <text x="1160" y="562" text-anchor="middle" class="badge">7</text>
    <text x="1200" y="562" class="step">Return safe response</text>
    <text x="1145" y="610" class="detail">200 + token + safe user data</text>
    <text x="1145" y="645" class="detail">never return a password</text>
  </g>

  <path d="M490 598 H590" class="arrow"/>
  <path d="M995 598 H1095" class="arrow"/>

  <rect x="250" y="760" width="1100" height="72" rx="20" fill="#0a1829" stroke="#f3b64c" stroke-width="2"/>
  <text x="800" y="806" text-anchor="middle" class="step">A JWT is signed, not encrypted — never put secrets or password data in its payload.</text>
</svg>
