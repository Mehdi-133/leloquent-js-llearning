<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Brief 2 LMS scope and role boundaries</title>
  <desc id="desc">Four roles connect through authentication, role checks, and ownership checks to the LMS course, enrollment, resource, and progress data.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eff6ff"/>
      <stop offset="1" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d4ed8"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <text x="60" y="58" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#172554">Brief 2 — Who can do what?</text>
  <text x="60" y="88" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#475569">Every protected action passes through identity, role, and ownership checks.</text>

  <g filter="url(#shadow)">
    <rect x="55" y="135" width="230" height="120" rx="18" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
    <circle cx="91" cy="173" r="20" fill="#dbeafe"/>
    <text x="91" y="180" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#1e3a8a">V</text>
    <text x="124" y="175" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#1e3a8a">Visitor</text>
    <text x="78" y="213" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#334155">Browse published courses</text>
    <text x="78" y="237" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#64748b">No private content</text>

    <rect x="55" y="290" width="230" height="135" rx="18" fill="#ffffff" stroke="#60a5fa" stroke-width="2"/>
    <circle cx="91" cy="328" r="20" fill="#dbeafe"/>
    <text x="91" y="335" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#1e3a8a">L</text>
    <text x="124" y="330" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#1e3a8a">Learner</text>
    <text x="78" y="369" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#334155">Enrolled content</text>
    <text x="78" y="393" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#334155">Sequential progress</text>

    <rect x="915" y="135" width="230" height="135" rx="18" fill="#ffffff" stroke="#fb923c" stroke-width="2"/>
    <circle cx="951" cy="173" r="20" fill="#ffedd5"/>
    <text x="951" y="180" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#9a3412">T</text>
    <text x="984" y="175" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#9a3412">Trainer</text>
    <text x="938" y="214" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#334155">Manage own courses</text>
    <text x="938" y="238" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#334155">View own learners</text>

    <rect x="915" y="305" width="230" height="120" rx="18" fill="#ffffff" stroke="#a78bfa" stroke-width="2"/>
    <circle cx="951" cy="343" r="20" fill="#ede9fe"/>
    <text x="951" y="350" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#5b21b6">A</text>
    <text x="984" y="345" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#5b21b6">Admin</text>
    <text x="938" y="384" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#334155">Platform supervision</text>
    <text x="938" y="408" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#64748b">Cross-course access</text>
  </g>

  <g stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M285 195 C355 195 370 250 430 275"/>
    <path d="M285 357 C350 357 370 335 430 325"/>
    <path d="M915 205 C850 205 835 250 770 275"/>
    <path d="M915 365 C850 365 835 335 770 325"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="430" y="160" width="340" height="255" rx="26" fill="url(#core)"/>
    <text x="600" y="205" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#ffffff">Express LMS API</text>
    <rect x="475" y="232" width="250" height="46" rx="12" fill="#ffffff" fill-opacity="0.14" stroke="#bfdbfe"/>
    <text x="600" y="261" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" fill="#ffffff">1. Authenticate the JWT</text>
    <rect x="475" y="292" width="250" height="46" rx="12" fill="#ffffff" fill-opacity="0.14" stroke="#bfdbfe"/>
    <text x="600" y="321" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" fill="#ffffff">2. Authorize the role</text>
    <rect x="475" y="352" width="250" height="46" rx="12" fill="#ffffff" fill-opacity="0.14" stroke="#bfdbfe"/>
    <text x="600" y="381" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" fill="#ffffff">3. Check ownership and state</text>
  </g>

  <path d="M600 415 L600 474" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <rect x="170" y="490" width="860" height="125" rx="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="600" y="525" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#172554">MongoDB application data</text>
    <g font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" text-anchor="middle">
      <rect x="215" y="550" width="135" height="38" rx="10" fill="#dbeafe"/><text x="282" y="575" fill="#1e3a8a">Users</text>
      <rect x="375" y="550" width="135" height="38" rx="10" fill="#e0f2fe"/><text x="442" y="575" fill="#075985">Courses</text>
      <rect x="535" y="550" width="135" height="38" rx="10" fill="#dcfce7"/><text x="602" y="575" fill="#166534">Enrollments</text>
      <rect x="695" y="550" width="135" height="38" rx="10" fill="#ffedd5"/><text x="762" y="575" fill="#9a3412">Resources</text>
      <rect x="855" y="550" width="135" height="38" rx="10" fill="#ede9fe"/><text x="922" y="575" fill="#5b21b6">Progress</text>
    </g>
  </g>

  <text x="600" y="649" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#64748b">Role answers “what kind of user?” — ownership answers “whose course or data?”</text>
</svg>
