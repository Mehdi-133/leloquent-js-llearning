<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Brief 2 implementation dependency roadmap</title>
  <desc id="desc">A six-stage roadmap from stabilizing the existing API to proving and documenting the finished LMS behavior, with bonus work held until the mandatory foundation is complete.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eff6ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.13"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <text x="60" y="58" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#172554">Brief 2 — Build in dependency order</text>
  <text x="60" y="89" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#475569">Each stage protects the next one. Skipping a foundation makes later behavior unreliable.</text>

  <line x1="140" y1="285" x2="1060" y2="285" stroke="#94a3b8" stroke-width="5" marker-end="url(#arrow)"/>

  <g font-family="Segoe UI, Arial, sans-serif" filter="url(#shadow)">
    <g>
      <circle cx="145" cy="285" r="43" fill="#1d4ed8"/>
      <text x="145" y="294" text-anchor="middle" font-size="25" font-weight="700" fill="#ffffff">1</text>
      <rect x="60" y="345" width="170" height="135" rx="18" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
      <text x="145" y="380" text-anchor="middle" font-size="18" font-weight="700" fill="#1e3a8a">Stabilize</text>
      <text x="80" y="414" font-size="14" fill="#334155">• Install and seed</text>
      <text x="80" y="438" font-size="14" fill="#334155">• Check catalog</text>
      <text x="80" y="462" font-size="14" fill="#334155">• Record baseline</text>
    </g>

    <g>
      <circle cx="325" cy="285" r="43" fill="#2563eb"/>
      <text x="325" y="294" text-anchor="middle" font-size="25" font-weight="700" fill="#ffffff">2</text>
      <rect x="240" y="130" width="170" height="135" rx="18" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
      <text x="325" y="165" text-anchor="middle" font-size="18" font-weight="700" fill="#1e3a8a">Identity</text>
      <text x="260" y="199" font-size="14" fill="#334155">• Hash password</text>
      <text x="260" y="223" font-size="14" fill="#334155">• Login and JWT</text>
      <text x="260" y="247" font-size="14" fill="#334155">• Current profile</text>
    </g>

    <g>
      <circle cx="505" cy="285" r="43" fill="#4f46e5"/>
      <text x="505" y="294" text-anchor="middle" font-size="25" font-weight="700" fill="#ffffff">3</text>
      <rect x="420" y="345" width="170" height="135" rx="18" fill="#ffffff" stroke="#a5b4fc" stroke-width="2"/>
      <text x="505" y="380" text-anchor="middle" font-size="18" font-weight="700" fill="#3730a3">Permissions</text>
      <text x="440" y="414" font-size="14" fill="#334155">• Role checks</text>
      <text x="440" y="438" font-size="14" fill="#334155">• Ownership</text>
      <text x="440" y="462" font-size="14" fill="#334155">• 401 and 403</text>
    </g>

    <g>
      <circle cx="685" cy="285" r="43" fill="#7c3aed"/>
      <text x="685" y="294" text-anchor="middle" font-size="25" font-weight="700" fill="#ffffff">4</text>
      <rect x="600" y="130" width="170" height="135" rx="18" fill="#ffffff" stroke="#c4b5fd" stroke-width="2"/>
      <text x="685" y="165" text-anchor="middle" font-size="18" font-weight="700" fill="#5b21b6">Learning data</text>
      <text x="620" y="199" font-size="14" fill="#334155">• Course order</text>
      <text x="620" y="223" font-size="14" fill="#334155">• Enrollment</text>
      <text x="620" y="247" font-size="14" fill="#334155">• File upload</text>
    </g>

    <g>
      <circle cx="865" cy="285" r="43" fill="#ea580c"/>
      <text x="865" y="294" text-anchor="middle" font-size="25" font-weight="700" fill="#ffffff">5</text>
      <rect x="780" y="345" width="170" height="135" rx="18" fill="#ffffff" stroke="#fdba74" stroke-width="2"/>
      <text x="865" y="380" text-anchor="middle" font-size="18" font-weight="700" fill="#9a3412">Progress</text>
      <text x="800" y="414" font-size="14" fill="#334155">• Sequential lock</text>
      <text x="800" y="438" font-size="14" fill="#334155">• Completion</text>
      <text x="800" y="462" font-size="14" fill="#334155">• Trainer view</text>
    </g>

    <g>
      <circle cx="1045" cy="285" r="43" fill="#059669"/>
      <text x="1045" y="294" text-anchor="middle" font-size="25" font-weight="700" fill="#ffffff">6</text>
      <rect x="960" y="130" width="170" height="135" rx="18" fill="#ffffff" stroke="#6ee7b7" stroke-width="2"/>
      <text x="1045" y="165" text-anchor="middle" font-size="18" font-weight="700" fill="#065f46">Prove and deliver</text>
      <text x="980" y="199" font-size="14" fill="#334155">• API scenarios</text>
      <text x="980" y="223" font-size="14" fill="#334155">• Automated tests</text>
      <text x="980" y="247" font-size="14" fill="#334155">• Docs and Docker</text>
    </g>
  </g>

  <g filter="url(#shadow)">
    <rect x="180" y="535" width="840" height="78" rx="20" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
    <text x="225" y="568" font-family="Segoe UI Emoji, Segoe UI, sans-serif" font-size="22">⏸️</text>
    <text x="266" y="567" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#9a3412">Bonus gate</text>
    <text x="266" y="593" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#7c2d12">Refresh tokens, cloud storage, advanced logs, and extra coverage wait until stages 1–6 are verified.</text>
  </g>

  <text x="600" y="650" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#64748b">The roadmap is a dependency guide, not permission to work on every stage at once.</text>
</svg>
