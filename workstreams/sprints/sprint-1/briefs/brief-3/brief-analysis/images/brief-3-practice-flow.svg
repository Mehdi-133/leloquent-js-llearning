<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title description">
  <title id="title">Brief 3 independent practice flow</title>
  <desc id="description">Five connected steps: plan, code alone, run, explain, and request review.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17132b"/>
      <stop offset="1" stop-color="#30235c"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#090716" flood-opacity="0.45"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#b7a7ff"/>
    </marker>
  </defs>

  <rect width="1200" height="675" rx="32" fill="url(#background)"/>
  <circle cx="1080" cy="90" r="150" fill="#7c5cff" opacity="0.12"/>
  <circle cx="110" cy="620" r="190" fill="#23c9a5" opacity="0.08"/>

  <text x="60" y="86" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="38" font-weight="700">Brief 3 practice flow</text>
  <text x="60" y="126" fill="#cfc7f7" font-family="Segoe UI, Arial, sans-serif" font-size="21">Protect the learner's first attempt, then use review to improve it.</text>

  <g stroke="#b7a7ff" stroke-width="5" fill="none" marker-end="url(#arrow)">
    <path d="M 232 350 H 278"/>
    <path d="M 462 350 H 508"/>
    <path d="M 692 350 H 738"/>
    <path d="M 922 350 H 968"/>
  </g>

  <g filter="url(#shadow)" font-family="Segoe UI, Arial, sans-serif">
    <g>
      <rect x="52" y="245" width="180" height="210" rx="24" fill="#5b43c7" stroke="#a999ff" stroke-width="2"/>
      <text x="142" y="295" text-anchor="middle" fill="#ddd6ff" font-size="18" font-weight="700">STEP 1</text>
      <text x="142" y="350" text-anchor="middle" fill="#ffffff" font-size="28" font-weight="700">Plan</text>
      <text x="142" y="390" text-anchor="middle" fill="#eeeaff" font-size="17">Write the flow</text>
      <text x="142" y="416" text-anchor="middle" fill="#eeeaff" font-size="17">in comments</text>
    </g>

    <g>
      <rect x="282" y="245" width="180" height="210" rx="24" fill="#244e75" stroke="#66b8ff" stroke-width="2"/>
      <text x="372" y="295" text-anchor="middle" fill="#c7e7ff" font-size="18" font-weight="700">STEP 2</text>
      <text x="372" y="342" text-anchor="middle" fill="#ffffff" font-size="27" font-weight="700">Code</text>
      <text x="372" y="375" text-anchor="middle" fill="#ffffff" font-size="27" font-weight="700">alone</text>
      <text x="372" y="416" text-anchor="middle" fill="#dff2ff" font-size="17">Protect the first</text>
      <text x="372" y="442" text-anchor="middle" fill="#dff2ff" font-size="17">attempt</text>
    </g>

    <g>
      <rect x="512" y="245" width="180" height="210" rx="24" fill="#176b61" stroke="#5be2c7" stroke-width="2"/>
      <text x="602" y="295" text-anchor="middle" fill="#c9fff3" font-size="18" font-weight="700">STEP 3</text>
      <text x="602" y="350" text-anchor="middle" fill="#ffffff" font-size="28" font-weight="700">Run</text>
      <text x="602" y="390" text-anchor="middle" fill="#dcfff7" font-size="17">Check the real</text>
      <text x="602" y="416" text-anchor="middle" fill="#dcfff7" font-size="17">behavior</text>
    </g>

    <g>
      <rect x="742" y="245" width="180" height="210" rx="24" fill="#8b4c23" stroke="#ffb56f" stroke-width="2"/>
      <text x="832" y="295" text-anchor="middle" fill="#ffe1c2" font-size="18" font-weight="700">STEP 4</text>
      <text x="832" y="350" text-anchor="middle" fill="#ffffff" font-size="28" font-weight="700">Explain</text>
      <text x="832" y="390" text-anchor="middle" fill="#fff0df" font-size="17">Describe why</text>
      <text x="832" y="416" text-anchor="middle" fill="#fff0df" font-size="17">it works</text>
    </g>

    <g>
      <rect x="972" y="245" width="180" height="210" rx="24" fill="#7d315d" stroke="#ff89cf" stroke-width="2"/>
      <text x="1062" y="295" text-anchor="middle" fill="#ffd7ef" font-size="18" font-weight="700">STEP 5</text>
      <text x="1062" y="342" text-anchor="middle" fill="#ffffff" font-size="27" font-weight="700">Request</text>
      <text x="1062" y="375" text-anchor="middle" fill="#ffffff" font-size="27" font-weight="700">review</text>
      <text x="1062" y="416" text-anchor="middle" fill="#ffe4f4" font-size="17">Improve the saved</text>
      <text x="1062" y="442" text-anchor="middle" fill="#ffe4f4" font-size="17">attempt</text>
    </g>
  </g>

  <rect x="250" y="530" width="700" height="70" rx="20" fill="#ffffff" opacity="0.08" stroke="#d9d2ff" stroke-opacity="0.35"/>
  <text x="600" y="574" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="600">AI coaches after the learner has something real to review.</text>
</svg>
