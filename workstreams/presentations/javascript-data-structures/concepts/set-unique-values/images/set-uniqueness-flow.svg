<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Set removes repeated primitive values</title><desc id="desc">An array with repeated category names becomes a set containing Video, PDF, and Quiz once each.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#f4c542"/></marker></defs><rect width="1200" height="675" rx="32" fill="#232323"/>
  <text x="600" y="72" text-anchor="middle" fill="#fff7e6" font-family="Arial" font-size="40" font-weight="700">Set: keep each primitive value once</text>
  <g font-family="Arial" text-anchor="middle"><text x="245" y="145" fill="#fff7e6" font-size="27" font-weight="700">Array input</text><text x="930" y="145" fill="#fff7e6" font-size="27" font-weight="700">Set output</text>
  <g font-size="24" font-weight="700"><rect x="80" y="180" width="330" height="70" rx="18" fill="#fff7e6"/><text x="245" y="225" fill="#232323">Video</text><rect x="80" y="265" width="330" height="70" rx="18" fill="#fff7e6"/><text x="245" y="310" fill="#232323">PDF</text><rect x="80" y="350" width="330" height="70" rx="18" fill="#ffcfca"/><text x="245" y="395" fill="#232323">Video — repeated</text><rect x="80" y="435" width="330" height="70" rx="18" fill="#fff7e6"/><text x="245" y="480" fill="#232323">Quiz</text><rect x="80" y="520" width="330" height="70" rx="18" fill="#ffcfca"/><text x="245" y="565" fill="#232323">PDF — repeated</text></g>
  <path d="M440 375H680" stroke="#f4c542" stroke-width="12" marker-end="url(#a)"/><text x="560" y="340" fill="#f4c542" font-size="28">new Set(values)</text>
  <circle cx="920" cy="375" r="210" fill="#fff7e6" stroke="#f4c542" stroke-width="12"/><g fill="#232323" font-size="27" font-weight="700"><text x="920" y="295">Video</text><text x="920" y="385">PDF</text><text x="920" y="475">Quiz</text></g><text x="600" y="640" fill="#fff7e6" font-size="25">Objects are unique by identity, not by matching properties.</text></g>
</svg>
