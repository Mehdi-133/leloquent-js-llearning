<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">One source and derived structures</title><desc id="desc">A resources array produces a categories Set and resourcesById Map. After the source changes, the derived snapshots must be rebuilt or updated.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#f4c542"/></marker></defs><rect width="1200" height="675" rx="32" fill="#232323"/><text x="600" y="70" text-anchor="middle" fill="#fff7e6" font-family="Arial" font-size="40" font-weight="700">One source of truth, several useful views</text>
  <g font-family="Arial" text-anchor="middle"><rect x="390" y="125" width="420" height="150" rx="26" fill="#f4c542"/><text x="600" y="180" fill="#232323" font-size="29" font-weight="700">resources Array</text><text x="600" y="228" fill="#232323" font-size="23">ordered source collection</text>
  <path d="M500 280C440 340 340 350 300 415M700 280C760 340 860 350 900 415" fill="none" stroke="#f4c542" stroke-width="10" marker-end="url(#a)"/>
  <rect x="90" y="420" width="390" height="140" rx="26" fill="#fff7e6"/><text x="285" y="475" fill="#232323" font-size="28" font-weight="700">categories Set</text><text x="285" y="520" fill="#232323" font-size="22">unique category values</text>
  <rect x="720" y="420" width="390" height="140" rx="26" fill="#fff7e6"/><text x="915" y="475" fill="#232323" font-size="28" font-weight="700">resourcesById Map</text><text x="915" y="520" fill="#232323" font-size="22">lookup by resource ID</text>
  <path d="M490 595C560 640 640 640 710 595" fill="none" stroke="#ff7a66" stroke-width="8" stroke-dasharray="18 12" marker-end="url(#a)"/><text x="600" y="595" fill="#ffcfca" font-size="22">source changed? rebuild or update</text></g></svg>
