<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">JavaScript object copy methods</title>
  <desc id="desc">Assignment shares the outer object and nested values. Spread and Object.assign create a new outer object but share nested values. Manual nested spread copies selected levels. structuredClone deeply copies supported nested data.</desc>
  <rect width="1200" height="675" rx="32" fill="#232323"/>
  <text x="600" y="72" text-anchor="middle" fill="#fff7e6" font-family="Arial" font-size="40" font-weight="700">Choosing an object copy method</text>
  <g font-family="Arial" text-anchor="middle">
    <g fill="#fff7e6">
      <rect x="45" y="140" width="255" height="370" rx="24"/>
      <rect x="330" y="140" width="255" height="370" rx="24"/>
      <rect x="615" y="140" width="255" height="370" rx="24"/>
      <rect x="900" y="140" width="255" height="370" rx="24"/>
    </g>
    <g fill="#232323" font-size="25" font-weight="700">
      <text x="172" y="195">Assignment</text>
      <text x="457" y="195">Spread / assign</text>
      <text x="742" y="195">Nested spread</text>
      <text x="1027" y="195">structuredClone</text>
    </g>
    <g font-size="21">
      <text x="172" y="245" fill="#232323">second = original</text>
      <text x="457" y="245" fill="#232323">{ ...original }</text>
      <text x="742" y="245" fill="#232323">copy chosen levels</text>
      <text x="1027" y="245" fill="#232323">clone supported data</text>
    </g>
    <g font-size="23" font-weight="700">
      <text x="172" y="330" fill="#b3392f">outer: shared</text>
      <text x="172" y="390" fill="#b3392f">nested: shared</text>
      <text x="457" y="330" fill="#087f7a">outer: new</text>
      <text x="457" y="390" fill="#b3392f">nested: shared</text>
      <text x="742" y="330" fill="#087f7a">outer: new</text>
      <text x="742" y="390" fill="#087f7a">chosen levels: new</text>
      <text x="1027" y="330" fill="#087f7a">outer: new</text>
      <text x="1027" y="390" fill="#087f7a">nested data: new</text>
    </g>
    <g fill="#f4c542" font-size="22" font-weight="700">
      <text x="172" y="470">No copy</text>
      <text x="457" y="470">Shallow copy</text>
      <text x="742" y="470">Selective copy</text>
      <text x="1027" y="470">Deep copy</text>
    </g>
    <rect x="105" y="555" width="990" height="70" rx="18" fill="#ffefb3"/>
    <text x="600" y="600" fill="#232323" font-size="24" font-weight="700">structuredClone() works with cloneable data; functions cause DataCloneError.</text>
  </g>
</svg>
