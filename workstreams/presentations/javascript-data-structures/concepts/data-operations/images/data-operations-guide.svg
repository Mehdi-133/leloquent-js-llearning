<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Choose an array operation by result</title><desc id="desc">A comparison of forEach, map, find, filter, sort, and reduce by the result each operation produces.</desc><rect width="1200" height="675" rx="32" fill="#232323"/><text x="600" y="82" text-anchor="middle" fill="#fff7e6" font-family="Arial" font-size="40" font-weight="700">Choose the operation from the result you need</text>
  <g font-family="Arial"><g fill="#f4c542" font-size="25" font-weight="700"><text x="105" y="145">Question</text><text x="585" y="145">Tool</text><text x="785" y="145">Result</text></g>
  <g font-size="23"><rect x="55" y="170" width="1090" height="65" rx="16" fill="#fff7e6"/><text x="90" y="212" fill="#232323">Perform an action for every item</text><text x="585" y="212" fill="#232323" font-weight="700">forEach()</text><text x="785" y="212" fill="#232323">undefined</text>
  <rect x="55" y="245" width="1090" height="65" rx="16" fill="#fff7e6"/><text x="90" y="287" fill="#232323">Transform every item</text><text x="585" y="287" fill="#232323" font-weight="700">map()</text><text x="785" y="287" fill="#232323">new array</text>
  <rect x="55" y="320" width="1090" height="65" rx="16" fill="#fff7e6"/><text x="90" y="362" fill="#232323">Get the first match</text><text x="585" y="362" fill="#232323" font-weight="700">find()</text><text x="785" y="362" fill="#232323">item or undefined</text>
  <rect x="55" y="395" width="1090" height="65" rx="16" fill="#fff7e6"/><text x="90" y="437" fill="#232323">Keep every match</text><text x="585" y="437" fill="#232323" font-weight="700">filter()</text><text x="785" y="437" fill="#232323">new array</text>
  <rect x="55" y="470" width="1090" height="65" rx="16" fill="#ffefb3"/><text x="90" y="512" fill="#232323">Reorder items</text><text x="585" y="512" fill="#232323" font-weight="700">sort()</text><text x="785" y="512" fill="#b3392f">same mutated array</text>
  <rect x="55" y="545" width="1090" height="65" rx="16" fill="#fff7e6"/><text x="90" y="587" fill="#232323">Group items by a key</text><text x="585" y="587" fill="#232323" font-weight="700">reduce()</text><text x="785" y="587" fill="#232323">object or Map</text></g></g></svg>
