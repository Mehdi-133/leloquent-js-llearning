<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Array as an ordered collection</title><desc id="desc">Four course cards appear in numbered positions from zero to three, emphasizing order and index access.</desc><rect width="1200" height="675" rx="32" fill="#232323"/><text x="600" y="85" text-anchor="middle" fill="#fff7e6" font-family="Arial" font-size="42" font-weight="700">Array = ordered collection</text><g font-family="Arial" text-anchor="middle"><g fill="#f4c542" font-size="28" font-weight="700"><text x="210" y="180">0</text><text x="470" y="180">1</text><text x="730" y="180">2</text><text x="990" y="180">3</text></g><g><rect x="90" y="210" width="240" height="260" rx="28" fill="#fff7e6"/><rect x="350" y="210" width="240" height="260" rx="28" fill="#fff7e6"/><rect x="610" y="210" width="240" height="260" rx="28" fill="#fff7e6"/><rect x="870" y="210" width="240" height="260" rx="28" fill="#fff7e6"/></g><g fill="#232323" font-size="26" font-weight="700"><text x="210" y="330">JS Basics</text><text x="470" y="330">DOM</text><text x="730" y="330">Node</text><text x="990" y="330">MongoDB</text></g><path d="M130 535H1070" stroke="#f4c542" stroke-width="10"/><path d="M1070 535l-28-18v36z" fill="#f4c542"/><text x="600" y="600" fill="#fff7e6" font-size="27">Position and order are part of the data shape.</text></g></svg>
