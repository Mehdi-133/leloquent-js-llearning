<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">JavaScript data structure decision framework</title><desc id="desc">Four questions lead to Array, Object, Map, or Set.</desc><rect width="1200" height="675" rx="32" fill="#232323"/><text x="600" y="75" text-anchor="middle" fill="#fff7e6" font-family="Arial" font-size="42" font-weight="700">What does the program need?</text><g font-family="Arial" text-anchor="middle"><g fill="#fff7e6"><rect x="65" y="150" width="250" height="145" rx="24"/><rect x="340" y="150" width="250" height="145" rx="24"/><rect x="615" y="150" width="250" height="145" rx="24"/><rect x="890" y="150" width="250" height="145" rx="24"/></g><g fill="#232323" font-size="24" font-weight="700"><text x="190" y="210">Ordered list?</text><text x="465" y="210">One entity?</text><text x="740" y="210">Lookup by key?</text><text x="1015" y="210">Unique values?</text></g><g fill="#f4c542"><rect x="65" y="385" width="250" height="150" rx="26"/><rect x="340" y="385" width="250" height="150" rx="26"/><rect x="615" y="385" width="250" height="150" rx="26"/><rect x="890" y="385" width="250" height="150" rx="26"/></g><g fill="#232323" font-size="34" font-weight="700"><text x="190" y="475">Array</text><text x="465" y="475">Object</text><text x="740" y="475">Map</text><text x="1015" y="475">Set</text></g><g stroke="#f4c542" stroke-width="9"><path d="M190 305V375"/><path d="M465 305V375"/><path d="M740 305V375"/><path d="M1015 305V375"/></g><text x="600" y="620" fill="#fff7e6" font-size="26">Choose from the data shape and operation—not from habit.</text></g></svg>
