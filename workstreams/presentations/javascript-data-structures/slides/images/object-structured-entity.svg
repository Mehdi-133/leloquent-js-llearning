<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Object as one structured entity</title><desc id="desc">One course object contains named properties for id, title, level, and published status.</desc><rect width="1200" height="675" rx="32" fill="#232323"/><text x="600" y="78" text-anchor="middle" fill="#fff7e6" font-family="Arial" font-size="42" font-weight="700">Object = one entity with named properties</text><g font-family="Arial"><rect x="230" y="125" width="740" height="465" rx="32" fill="#fff7e6" stroke="#f4c542" stroke-width="10"/><text x="600" y="190" text-anchor="middle" fill="#232323" font-size="32" font-weight="700">course</text><g font-size="26"><text x="310" y="270" fill="#8a6500" font-weight="700">id</text><text x="535" y="270" fill="#232323">"js-101"</text><text x="310" y="350" fill="#8a6500" font-weight="700">title</text><text x="535" y="350" fill="#232323">"JavaScript Basics"</text><text x="310" y="430" fill="#8a6500" font-weight="700">level</text><text x="535" y="430" fill="#232323">"beginner"</text><text x="310" y="510" fill="#8a6500" font-weight="700">published</text><text x="535" y="510" fill="#087f7a">true</text></g></g></svg>
